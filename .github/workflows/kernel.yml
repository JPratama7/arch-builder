name: Kernel
on:
  push:
    paths:
    - 'linux-lilium/*'
  workflow_dispatch:


concurrency:
  group: ${{ github.ref }}/kernel
  cancel-in-progress: true

jobs:
  Kernel:
    strategy:
      matrix:
        build: [
          linux-lilium, linux-lqx
          ]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v4.1
        with:
          remove-android: 'true'
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-cached-tools: 'true'
          remove-large-packages: 'true'
          remove-codeql: 'true'
      - name: Build packages for arch
        uses: actions/checkout@v3.5.3
      - id: makepkg
        uses: JPratama7/pkgbuild-action@original
        with:
          clanged: "y"
          clangedPFlags: "y"
          OfficialRepo: "y"
          chaoticAur: "y"
          aurHelper: "yay"
          buildAurHelper: "y"
          namcapDisable: true
          pkgdir: ${{ matrix.build }}
          makepkgArgs: "--skippgpcheck"
      - name: Upload Artifact
        uses: ncipollo/release-action@v1.21.0
        with:
          allowUpdates: true
          replacesArtifacts: true
          tag: "temp"
          artifacts: "*/*.zst"
          token: ${{ secrets.GITHUB_TOKEN }}

  TRIGGER_PUBLISH:
    if: ${{ !cancelled() }}
    needs: [Kernel]
    runs-on: ubuntu-latest
    steps:
      - name: Check at least one build succeeded
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh run view ${{ github.run_id }} --json jobs \
            | jq -e 'any(.jobs[] | select(.name | startswith("Kernel")); .conclusion == "success")' > /dev/null; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Invoke workflow without inputs
        if: steps.gate.outputs.go == 'true'
        uses: benc-uk/workflow-dispatch@v1.2.2
        with:
          workflow: Create DB
