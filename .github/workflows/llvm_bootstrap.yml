name: LLVM Bootstrap
on:
  workflow_dispatch:
  push:
    paths:
    - 'llvm-bootstrap/*'

concurrency: 
  group: ${{ github.ref }}/toolchain
  cancel-in-progress: true

jobs:
  bootstrap1:
    strategy:
      matrix:
        build: [llvm-bootstrap]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v5.1
        with:
          remove-android: 'true'
          remove-dotnet: 'true'
          remove-cached-tools: 'true'
          remove-large-packages: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
  
      - name: Build packages for arch
        uses: actions/checkout@v7.0.1
      - id: makepkg
        uses: JPratama7/pkgbuild-action@original
        with:
          pkgdir: ${{ matrix.build }}
          makepkgArgs: "--skippgpcheck --skipchecksums"
          maxJobs: "99"
          gccPflags: "y"
          chaoticAur: "y"
      # - name: Wait
      #   run: sleep 5m
      #   shell: bash
      - name: Upload Artifact
        uses: ncipollo/release-action@v1.21.0
        with:
          allowUpdates: true
          tag: "latest"
          artifacts: "./*/*.zst"
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Invoke workflow without inputs
        uses: benc-uk/workflow-dispatch@v1.3.3
        with:
          workflow: Create DB Manual